[phases.setup]
nixPkgs = ["python311", "gdal", "geos", "proj", "postgresql", "gcc", "binutils", "pkg-config"]

[phases.install]
cmds = ["python -m venv /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[start]
cmd = "python manage.py migrate && gunicorn config.wsgi:application --log-file -"
